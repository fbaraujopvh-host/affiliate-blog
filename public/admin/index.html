<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — euteindico.com</title>
  <!-- Bloqueia indexação do painel -->
  <meta name="robots" content="noindex, nofollow" />
  <script src="https://unpkg.com/decap-cms@3.3.3/dist/decap-cms.js"></script>
</head>
<body>
  <div id="nc-root"></div>
  <script>
    // Mostra erro se o CMS não inicializar em 10s
    setTimeout(function() {
      var root = document.getElementById('nc-root');
      if (root && root.children.length === 0) {
        document.body.innerHTML =
          '<div style="font-family:sans-serif;padding:2rem;color:#333">' +
          '<h2>⚠️ Erro ao carregar o CMS</h2>' +
          '<p>Abra o Console do navegador (F12) e recarregue a página para ver o erro.</p>' +
          '</div>';
      }
    }, 10000);
  </script>
</body>
</html>
