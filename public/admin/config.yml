backend:
  name: github
  repo: fbaraujopvh-host/affiliate-blog
  branch: main
  auth_endpoint: /api/auth
  base_url: https://euteindico.com

media_folder: public/uploads
public_folder: /uploads

collections:

  # ── POSTS DO BLOG ──────────────────────────────────────────────────────────
  - name: posts
    label: Posts do Blog
    label_singular: Post
    folder: src/content/posts
    create: true
    slug: "{{slug}}"
    preview_path: /blog/{{slug}}
    fields:
      - label: Título
        name: title
        widget: string
      - label: Resumo
        name: excerpt
        widget: text
      - label: Categoria
        name: category
        widget: select
        options:
          - { label: Eletrônicos, value: eletronicos }
          - { label: Casa & Cozinha, value: casa }
          - { label: Esportes, value: esportes }
          - { label: Informática, value: informatica }
          - { label: Beleza, value: beleza }
          - { label: Livros, value: livros }
      - label: Imagem de Capa
        name: image
        widget: image
      - label: Texto Alternativo da Imagem
        name: imageAlt
        widget: string
        required: false
      - label: Data de Publicação
        name: publishedAt
        widget: datetime
        format: YYYY-MM-DD
      - label: Tempo de Leitura (min)
        name: readingTime
        widget: number
        default: 5
      - label: Destaque na Home
        name: featured
        widget: boolean
        default: false
      - label: Conteúdo
        name: body
        widget: markdown

  # ── PRODUTOS ───────────────────────────────────────────────────────────────
  - name: products
    label: Produtos
    label_singular: Produto
    folder: src/content/products
    create: true
    slug: "{{slug}}"
    extension: json
    format: json
    fields:
      - label: Nome do Produto
        name: name
        widget: string
      - label: Imagem
        name: image
        widget: image
      - label: Preço
        name: price
        widget: string
        hint: "Ex: R$ 249,00"
      - label: Preço Antigo
        name: oldPrice
        widget: string
        required: false
        hint: "Deixe vazio se não houver desconto"
      - label: Avaliação (1 a 5 estrelas)
        name: rating
        widget: number
        min: 1
        max: 5
        step: 0.5
        default: 4
      - label: Número de Avaliações
        name: reviewCount
        widget: number
        default: 0
      - label: Link de Afiliado Amazon
        name: affiliateUrl
        widget: string
      - label: Badge
        name: badge
        widget: string
        required: false
        hint: "Ex: Mais Vendido, 30% OFF"
      - label: Pontos Positivos
        name: pros
        widget: list
        field:
          label: Ponto
          name: item
          widget: string
      - label: Categoria
        name: category
        widget: select
        options:
          - { label: Eletrônicos, value: eletronicos }
          - { label: Casa & Cozinha, value: casa }
          - { label: Esportes, value: esportes }
          - { label: Informática, value: informatica }
          - { label: Beleza, value: beleza }
      - label: Destaque na Home
        name: featured
        widget: boolean
        default: false

  # ── PÁGINAS ────────────────────────────────────────────────────────────────
  - name: paginas
    label: Páginas
    files:
      - label: Página Inicial (Home)
        name: home
        file: src/content/paginas/home.json
        fields:
          - { label: Badge do Hero, name: heroBadge, widget: string }
          - { label: Título Principal, name: heroTitle, widget: string }
          - { label: Subtítulo, name: heroSubtitle, widget: string }
          - { label: Descrição, name: heroDescription, widget: text }
          - { label: "Botão 1 — Texto", name: heroCta1Label, widget: string }
          - { label: "Botão 1 — Link", name: heroCta1Url, widget: string }
          - { label: "Botão 2 — Texto", name: heroCta2Label, widget: string }
          - { label: "Botão 2 — Link", name: heroCta2Url, widget: string }

  # ── CONFIGURAÇÕES ──────────────────────────────────────────────────────────
  - name: configuracoes
    label: Configurações
    files:
      - label: Categorias
        name: categorias
        file: src/content/categorias/categorias.json
        fields:
          - label: Categorias
            name: items
            widget: list
            fields:
              - label: Nome
                name: name
                widget: string
                hint: "Ex: Eletrônicos"
              - label: "Ícone (emoji)"
                name: icon
                widget: string
                hint: "Ex: 📱"
              - label: "Slug (parte da URL)"
                name: slug
                widget: string
                hint: "Ex: eletronicos (sem acento, sem espaço)"
